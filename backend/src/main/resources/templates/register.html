<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IU Bookstore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" th:href="@{/}">IU Bookstore</a>
  <button class="hamburger" data-toggle-nav>☰</button>
  <nav class="nav" id="mainNav">
    <a th:href="@{/catalog}">Catalog</a>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/cart}">Cart</a>
    <a th:href="@{/orders}">Orders</a>
    <a th:href="@{/reservations}">Reservations</a>
    <a th:href="@{/notifications}">Notifications</a>
    <a th:href="@{/manager/books}">Manager</a>
    <a th:href="@{/admin/users}">Admin</a>
    <a th:href="@{/profile}">Profile</a>
    <form class="inline" th:action="@{/logout}" method="post"><button>Logout</button></form>
  </nav>
</header>
<main class="container">
<div th:if="${success}" class="alert success" th:text="${success}"></div>
<div th:if="${error}" class="alert error" th:text="${error}"></div>

<div class="auth-box"><h1>Register</h1><form th:action="@{/register}" th:object="${form}" method="post" data-validate>
<label>Full name<input th:field="*{fullName}" required minlength="3"><small th:errors="*{fullName}"></small></label>
<label>Email<input type="email" th:field="*{email}" required><small th:errors="*{email}"></small></label>
<label>Phone<input th:field="*{phone}" required><small th:errors="*{phone}"></small></label>
<label>Password<input type="password" th:field="*{password}" required minlength="8"><small th:errors="*{password}"></small></label>
<label>Confirm password<input type="password" th:field="*{confirmPassword}" required><small th:errors="*{confirmPassword}"></small></label>
<button class="btn primary">Register</button></form></div>

</main>
<footer class="footer">Bookstore Management System · Web Application Development Final Project</footer>
</body></html>
