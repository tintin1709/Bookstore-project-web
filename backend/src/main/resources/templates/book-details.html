<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IU Bookstore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" th:href="@{/}">IU Bookstore</a>
  <button class="hamburger" data-toggle-nav>☰</button>
  <nav class="nav" id="mainNav">
    <a th:href="@{/catalog}">Catalog</a>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/cart}">Cart</a>
    <a th:href="@{/orders}">Orders</a>
    <a th:href="@{/reservations}">Reservations</a>
    <a th:href="@{/notifications}">Notifications</a>
    <a th:href="@{/manager/books}">Manager</a>
    <a th:href="@{/admin/users}">Admin</a>
    <a th:href="@{/profile}">Profile</a>
    <form class="inline" th:action="@{/logout}" method="post"><button>Logout</button></form>
  </nav>
</header>
<main class="container">
<div th:if="${success}" class="alert success" th:text="${success}"></div>
<div th:if="${error}" class="alert error" th:text="${error}"></div>

<div class="detail"><img th:src="${book.imageUrl}" alt="Book cover"><section><h1 th:text="${book.title}"></h1><p class="muted" th:text="${book.authors}"></p><p th:text="${book.description}"></p><p>Category: <strong th:text="${book.categoryName}"></strong></p><p>ISBN: <strong th:text="${book.isbn13}"></strong></p><p>Stock: <strong th:text="${book.stockOnHand}"></strong></p><h2 th:text="${#numbers.formatDecimal(book.listPrice,0,'COMMA',0,'POINT')} + ' VND'"></h2><div class="actions"><form th:action="@{/cart/add/{id}(id=${book.id})}" method="post"><input type="number" name="quantity" value="1" min="1"><button class="btn primary">Add to cart</button></form><form th:action="@{/reservations/book/{id}(id=${book.id})}" method="post"><input type="number" name="quantity" value="1" min="1"><button class="btn">Reserve</button></form></div></section></div>

</main>
<footer class="footer">Bookstore Management System · Web Application Development Final Project</footer>
</body></html>
