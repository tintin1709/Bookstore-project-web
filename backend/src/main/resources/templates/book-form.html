<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IU Bookstore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" th:href="@{/}">IU Bookstore</a>
  <button class="hamburger" data-toggle-nav>☰</button>
  <nav class="nav" id="mainNav">
    <a th:href="@{/catalog}">Catalog</a>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/cart}">Cart</a>
    <a th:href="@{/orders}">Orders</a>
    <a th:href="@{/reservations}">Reservations</a>
    <a th:href="@{/notifications}">Notifications</a>
    <a th:href="@{/manager/books}">Manager</a>
    <a th:href="@{/admin/users}">Admin</a>
    <a th:href="@{/profile}">Profile</a>
    <form class="inline" th:action="@{/logout}" method="post"><button>Logout</button></form>
  </nav>
</header>
<main class="container">
<div th:if="${success}" class="alert success" th:text="${success}"></div>
<div th:if="${error}" class="alert error" th:text="${error}"></div>

<h1 th:text="${book.id == null ? 'New Book' : 'Edit Book'}"></h1><form class="card form-grid" th:action="@{/manager/books}" th:object="${book}" method="post" data-validate><input type="hidden" th:field="*{id}"><label>Category<select th:field="*{categoryId}" required><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label><label>SKU<input th:field="*{sku}" required></label><label>ISBN13<input th:field="*{isbn13}" minlength="13" maxlength="13" required></label><label>Title<input th:field="*{title}" required></label><label>Publisher<input th:field="*{publisher}"></label><label>Year<input type="number" th:field="*{publicationYear}"></label><label>Language<input th:field="*{language}"></label><label>Price<input type="number" step="0.01" th:field="*{listPrice}" required min="0"></label><label>Stock<input type="number" th:field="*{stockOnHand}" required min="0"></label><label>Reorder level<input type="number" th:field="*{reorderLevel}" required min="0"></label><label>Status<select th:field="*{status}"><option>ACTIVE</option><option>INACTIVE</option></select></label><label>Image URL<input th:field="*{imageUrl}"></label><label class="wide">Description<textarea th:field="*{description}"></textarea></label><button class="btn primary">Save</button></form>

</main>
<footer class="footer">Bookstore Management System · Web Application Development Final Project</footer>
</body></html>
