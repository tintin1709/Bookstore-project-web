<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IU Bookstore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" th:href="@{/}">IU Bookstore</a>
  <button class="hamburger" data-toggle-nav>☰</button>
  <nav class="nav" id="mainNav">
    <a th:href="@{/catalog}">Catalog</a>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/cart}">Cart</a>
    <a th:href="@{/orders}">Orders</a>
    <a th:href="@{/reservations}">Reservations</a>
    <a th:href="@{/notifications}">Notifications</a>
    <a th:href="@{/manager/books}">Manager</a>
    <a th:href="@{/admin/users}">Admin</a>
    <a th:href="@{/profile}">Profile</a>
    <form class="inline" th:action="@{/logout}" method="post"><button>Logout</button></form>
  </nav>
</header>
<main class="container">
<div th:if="${success}" class="alert success" th:text="${success}"></div>
<div th:if="${error}" class="alert error" th:text="${error}"></div>

<h1>Manager · Books</h1><div class="actions"><a class="btn primary" th:href="@{/manager/books/new}">New book</a><a class="btn" th:href="@{/manager/export/books.csv}">Export CSV</a></div><form class="filters"><input name="q" th:value="${q}" placeholder="Search"><select name="status"><option value="">Any status</option><option>ACTIVE</option><option>INACTIVE</option></select><button class="btn primary">Filter</button></form><p th:text="'Showing ' + ${pageResult.startItem} + '-' + ${pageResult.endItem} + ' of ' + ${pageResult.totalItems}"></p><table><tr><th>SKU</th><th>Title</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Action</th></tr><tr th:each="b:${pageResult.items}"><td th:text="${b.sku}"></td><td th:text="${b.title}"></td><td th:text="${b.categoryName}"></td><td th:text="${b.listPrice}"></td><td th:text="${b.stockOnHand}"></td><td th:text="${b.status}"></td><td><a class="btn" th:href="@{/manager/books/{id}/edit(id=${b.id})}">Edit</a><form class="inline" th:action="@{/manager/books/{id}/delete(id=${b.id})}" method="post" data-confirm="Soft delete this book?"><button class="btn danger">Delete</button></form></td></tr></table>

</main>
<footer class="footer">Bookstore Management System · Web Application Development Final Project</footer>
</body></html>
