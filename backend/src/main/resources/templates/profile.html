<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IU Bookstore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" th:href="@{/}">IU Bookstore</a>
  <button class="hamburger" data-toggle-nav>☰</button>
  <nav class="nav" id="mainNav">
    <a th:href="@{/catalog}">Catalog</a>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/cart}">Cart</a>
    <a th:href="@{/orders}">Orders</a>
    <a th:href="@{/reservations}">Reservations</a>
    <a th:href="@{/notifications}">Notifications</a>
    <a th:href="@{/manager/books}">Manager</a>
    <a th:href="@{/admin/users}">Admin</a>
    <a th:href="@{/profile}">Profile</a>
    <form class="inline" th:action="@{/logout}" method="post"><button>Logout</button></form>
  </nav>
</header>
<main class="container">
<div th:if="${success}" class="alert success" th:text="${success}"></div>
<div th:if="${error}" class="alert error" th:text="${error}"></div>

<h1>Profile</h1><div class="grid two"><form class="card" th:action="@{/profile/update}" method="post"><label>Full name<input name="fullName" th:value="${user.fullName}" required></label><label>Phone<input name="phone" th:value="${user.phone}" required></label><button class="btn primary">Save</button></form><form class="card" th:action="@{/profile/password}" method="post"><label>New password<input type="password" name="newPassword" minlength="8" required></label><button class="btn">Change password</button></form></div>

</main>
<footer class="footer">Bookstore Management System · Web Application Development Final Project</footer>
</body></html>
