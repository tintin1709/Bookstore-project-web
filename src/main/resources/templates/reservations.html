<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IU Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>

  <body>
    <header class="topbar">
      <a class="brand" th:href="@{/}">IU Bookstore</a>
      <button class="hamburger" data-toggle-nav>☰</button>
      <nav class="nav" id="mainNav">
        <a th:href="@{/catalog}">Catalog</a>
        <a
          sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'STAFF')"
          th:href="@{/dashboard}"
          >Dashboard</a
        >
        <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/cart}">Cart</a>
        <a th:href="@{/orders}">Orders</a>
        <a th:href="@{/reservations}">Reservations</a>
        <a th:href="@{/notifications}">Notifications</a>
        <a
          sec:authorize="hasAnyRole('ADMIN', 'MANAGER')"
          th:href="@{/manager/books}"
          >Manager</a
        >
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Admin</a>
        <a th:href="@{/profile}">Profile</a>

        <form class="inline" th:action="@{/logout}" method="post">
          <button>Logout</button>
        </form>
      </nav>
    </header>

    <main class="container">
      <div th:if="${success}" class="alert success" th:text="${success}"></div>
      <div th:if="${error}" class="alert error" th:text="${error}"></div>

      <h1>My Reservations</h1>
      <table>
        <tr>
          <th>Book</th>
          <th>Qty</th>
          <th>Status</th>
          <th>Reserved at</th>
          <th>Expires</th>
          <th>Details</th>
        </tr>

        <tr th:each="r:${reservations}">
          <td th:text="${r.bookTitle}"></td>

          <td th:text="${r.quantity}"></td>

          <td>
            <span
              class="status-badge"
              th:text="${r.status == 'WAITING' ? 'Pending approval' :
                     r.status == 'APPROVED' ? 'Approved' :
                     r.status == 'REJECTED' ? 'Rejected' :
                     r.status}"
            >
            </span>
          </td>

          <td
            th:text="${#temporals.format(r.reservedAt, 'dd/MM/yyyy HH:mm')}"
          ></td>

          <td
            th:text="${r.expiresAt != null ? #temporals.format(r.expiresAt, 'dd/MM/yyyy HH:mm') : 'No expiration'}"
          ></td>

          <td>
            <details class="book-details">
              <summary class="btn small">View details</summary>

              <div class="details-box">
                <p>
                  <strong>Book:</strong>
                  <span th:text="${r.bookTitle}"></span>
                </p>

                <p>
                  <strong>Quantity:</strong>
                  <span th:text="${r.quantity}"></span>
                </p>

                <p>
                  <strong>Status:</strong>
                  <span
                    th:text="${r.status == 'WAITING' ? 'Waiting for staff approval' :
                           r.status == 'APPROVED' ? 'Approved by staff' :
                           r.status == 'REJECTED' ? 'Rejected by staff' :
                           r.status}"
                  >
                  </span>
                </p>

                <p>
                  <strong>Reserved at:</strong>
                  <span
                    th:text="${#temporals.format(r.reservedAt, 'dd/MM/yyyy HH:mm')}"
                  ></span>
                </p>

                <p>
                  <strong>Expires:</strong>
                  <span
                    th:text="${r.expiresAt != null ? #temporals.format(r.expiresAt, 'dd/MM/yyyy HH:mm') : 'No expiration'}"
                  ></span>
                </p>
              </div>
            </details>
          </td>
        </tr>
      </table>
    </main>

    <footer class="footer">
      Bookstore Management System · Web Application Development Final Project
    </footer>
  </body>
</html>
