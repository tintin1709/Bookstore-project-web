<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IU Bookstore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>

<body>
  <header class="topbar">
    <a class="brand" th:href="@{/}">IU Bookstore</a>
    <button class="hamburger" data-toggle-nav>☰</button>
    <nav class="nav" id="mainNav">
      <a th:href="@{/catalog}">Catalog</a>
      <a sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'STAFF')" th:href="@{/dashboard}">Dashboard</a>
      <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/cart}">Cart</a>
      <a th:href="@{/orders}">Orders</a>
      <a th:href="@{/reservations}">Reservations</a>
      <a th:href="@{/notifications}">Notifications</a>
      <a sec:authorize="hasAnyRole('ADMIN', 'MANAGER')" th:href="@{/manager/books}">Manager</a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Admin</a>
      <a th:href="@{/profile}">Profile</a>
      
      <form class="inline" th:action="@{/logout}" method="post">
        <button>Logout</button>
      </form>
    </nav>
  </header>

  <main class="container">
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <h1>Authors</h1>
    <form class="card form-grid" th:action="@{/manager/authors}" th:object="${author}" method="post">
      <label>Name<input th:field="*{name}" required></label>
      <label>Slug<input th:field="*{slug}" required></label>
      <label>Country<input th:field="*{country}"></label>

      <label>Status
        <select th:field="*{status}">
          <option>ACTIVE</option>
          <option>INACTIVE</option>
        </select>
      </label>

      <label class="wide">Biography<textarea th:field="*{biography}"></textarea></label>
      <button class="btn primary">Add author</button>
    </form>
    
    <table>
      <tr>
        <th>Name</th>
        <th>Country</th>
        <th>Status</th>
      </tr>

      <tr th:each="a:${authors}">
        <td th:text="${a.name}"></td>
        <td th:text="${a.country}"></td>
        <td th:text="${a.status}"></td>
      </tr>
    </table>
  </main>

  <footer class="footer">
    Bookstore Management System · Web Application Development Final Project
  </footer>
</body>
</html>
