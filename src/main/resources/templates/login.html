<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IU Bookstore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>

<body>
  <header class="topbar">
    <a class="brand" th:href="@{/}">IU Bookstore</a>
    <button class="hamburger" data-toggle-nav>☰</button>
    <nav class="nav" id="mainNav">
      <a th:href="@{/catalog}">Catalog</a>
      <a th:href="@{/login}">Login</a>
      <a th:href="@{/register}">Register</a>
    </nav>
  </header>
  
  <main class="container">
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <div class="auth-box">
      <h1>Login</h1>
      <form th:action="@{/login}" method="post" data-validate>
        <label>Email<input type="email" name="username" required></label>
        <label>Password<input type="password" name="password" required></label>
        <div class="action-field-login">
          <button class="btn primary">Login</button>
          <a th:href="@{/register}">Create new account</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    Bookstore Management System · Web Application Development Final Project
  </footer>

</body>
</html>
