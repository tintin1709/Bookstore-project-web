<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IU Bookstore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" th:href="@{/}">IU Bookstore</a>
  <button class="hamburger" data-toggle-nav>☰</button>
  <nav class="nav" id="mainNav">
    <a th:href="@{/catalog}">Catalog</a>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/cart}">Cart</a>
    <a th:href="@{/orders}">Orders</a>
    <a th:href="@{/reservations}">Reservations</a>
    <a th:href="@{/notifications}">Notifications</a>
    <a th:href="@{/manager/books}">Manager</a>
    <a th:href="@{/admin/users}">Admin</a>
    <a th:href="@{/profile}">Profile</a>
    <form class="inline" th:action="@{/logout}" method="post"><button>Logout</button></form>
  </nav>
</header>
<main class="container">
<div th:if="${success}" class="alert success" th:text="${success}"></div>
<div th:if="${error}" class="alert error" th:text="${error}"></div>

<h1>Catalog</h1>
<form class="filters" method="get" th:action="@{/catalog}"><input name="q" placeholder="Search title, SKU, ISBN" th:value="${q}"><select name="categoryId"><option value="">All categories</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId == c.id}"></option></select><input name="minPrice" type="number" placeholder="Min price" th:value="${minPrice}"><input name="maxPrice" type="number" placeholder="Max price" th:value="${maxPrice}"><input name="minStock" type="number" placeholder="Min stock" th:value="${minStock}"><select name="sort"><option value="title">Title</option><option value="price_asc">Price ↑</option><option value="price_desc">Price ↓</option><option value="newest">Newest</option></select><select name="size"><option>10</option><option>20</option><option>50</option><option>100</option></select><button class="btn primary">Search</button></form>
<p class="muted" th:text="'Showing ' + ${pageResult.startItem} + '-' + ${pageResult.endItem} + ' of ' + ${pageResult.totalItems} + ' results'"></p>
<div class="grid cards"><article class="card" th:each="b:${pageResult.items}"><img th:src="${b.imageUrl}" alt="Book cover"><h3 th:text="${b.title}"></h3><p><span th:text="${b.categoryName}"></span> · Stock: <span th:text="${b.stockOnHand}"></span></p><strong th:text="${#numbers.formatDecimal(b.listPrice,0,'COMMA',0,'POINT')} + ' VND'"></strong><div class="actions"><a class="btn" th:href="@{/catalog/{id}(id=${b.id})}">Details</a><form th:action="@{/cart/add/{id}(id=${b.id})}" method="post"><button class="btn primary">Add</button></form></div></article></div>
<div class="pagination"><a class="btn" th:if="${pageResult.hasPrevious()}" th:href="@{/catalog(page=${pageResult.page-1},size=${pageResult.size},q=${q})}">Previous</a><span th:text="'Page ' + ${pageResult.page + 1} + ' / ' + ${pageResult.totalPages}"></span><a class="btn" th:if="${pageResult.hasNext()}" th:href="@{/catalog(page=${pageResult.page+1},size=${pageResult.size},q=${q})}">Next</a></div>

</main>
<footer class="footer">Bookstore Management System · Web Application Development Final Project</footer>
</body></html>
